<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Ashokka Tech – Free Programming Tutorials</title>
    <meta name="description" content="Learn Java and Python step by step with simple explanations and examples.">
    <link rel="canonical" href="https://ashokka.com/">
     <link rel="icon" type="image/svg+xml" href="/images/logo.svg">
    <meta property="og:title" content="Ashokka Tech – Free Programming Tutorials">
    <meta property="og:type" content="article">
    <script src="/component/header.js" defer></script>
    <script src="/component/components.js" defer></script>
    <style>
        :root {
            --brand: #0f9d58;
            --brandd: #0b7a44;
            --bg: #fff;
            --side: #eefaf2;
            --text: #222;
            --muted: #666;
            --line: #ddd;
            --code: #f3f3f3;
            box-sizing: border-box
        }

        @media(prefers-color-scheme:dark) {
            :root {
                --bg: #121212;
                --side: #14231a;
                --text: #eee;
                --muted: #a8a8a8;
                --line: #333;
                --code: #262626;
                --brandd: #4cc38a
            }
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 17px/1.7 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif
        }

        a {
            color: var(--brandd);
            text-decoration: none
        }

        a:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--brand);
            outline-offset: 2px
        }

        header {
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 14px 24px;
            flex-wrap: wrap
        }

        .logo {
            font: 700 28px Georgia, serif;
            color: var(--text)
        }

        .logo b {
            color: var(--brand)
        }

        .search {
            flex: 1 1 260px;
            max-width: 600px;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 4px 16px
        }

        .search input {
            width: 100%;
            border: 0;
            background: none;
            color: var(--text);
            font: inherit;
            padding: 8px 0
        }

        .menus {
            display: flex;
            gap: 28px;
            margin-left: auto;
            font-weight: 600
        }

        .menus a {
            color: var(--text)
        }

        .langs {
            background: var(--brand);
            display: flex;
            gap: 26px;
            padding: 12px 24px;
            overflow-x: auto;
            white-space: nowrap
        }

        .langs a {
            color: #fff;
            font-size: 18px
        }

        .langs a[aria-current] {
            font-weight: 700;
            text-decoration: underline;
            text-underline-offset: 6px
        }

        .layout {
            display: grid;
            grid-template-columns: 280px minmax(0, 1fr) 260px;
            gap: 28px;
            align-items: start
        }

        .toc {
            background: var(--side);
            padding: 18px 16px;
            min-height: 80vh;
            font-size: 16px
        }

        .toc h2 {
            font-size: 19px;
            margin: 0 0 6px
        }

        .toc h3 {
            font-size: 17px;
            margin: 20px 0 4px
        }

        .toc ul {
            list-style: none;
            padding: 0;
            margin: 0
        }

        .toc li a {
            display: block;
            padding: 4px 0;
            color: var(--text)
        }

        .toc li a[aria-current] {
            color: var(--brandd);
            font-weight: 700
        }

        .crumbs {
            font-size: 14px;
            margin: 14px 0
        }

        .crumbs a {
            background: var(--side);
            padding: 2px 8px;
            border-radius: 4px
        }

        h1 {
            font-size: 34px;
            line-height: 1.25;
            font-weight: 500;
            margin: 12px 0 4px
        }

        article h2 {
            font-size: 24px;
            font-weight: 500;
            margin: 28px 0 6px
        }

        .upd {
            color: var(--muted);
            font-size: 15px;
            margin: 0 0 20px
        }

        pre {
            background: var(--code);
            padding: 14px 16px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 15px;
            line-height: 1.5
        }

        code {
            font-family: ui-monospace, Consolas, monospace
        }

        .np {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin: 40px 0
        }

        .np a {
            background: var(--brand);
            color: #fff;
            padding: 8px 18px;
            border-radius: 6px
        }

        .right {
            padding-right: 16px
        }

        .box {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px
        }

        .box h2 {
            font-size: 18px;
            margin: 0 0 6px
        }

        .box ul {
            margin: 0;
            padding-left: 18px
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin: 24px 0
        }

        .grid a {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 24px;
            font-size: 22px;
            font-weight: 600
        }

        footer {
            border-top: 1px solid var(--line);
            padding: 24px;
            color: var(--muted);
            text-align: center;
            margin-top: 24px
        }

        main.wide {
            max-width: 900px;
            margin: 0 auto;
            padding: 16px 24px
        }

        @media(max-width:1100px) {
            .layout {
                grid-template-columns: 240px minmax(0, 1fr)
            }

            .right {
                display: none
            }
        }

        @media(max-width:760px) {
            .layout {
                grid-template-columns: 1fr
            }

            .toc {
                min-height: 0
            }

            .menus {
                display: none
            }

            h1 {
                font-size: 28px
            }
        }

        /* HIGH VISIBILITY OVERLAY (Light Dark Tint + Soft Blur) */
        #splash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.45); /* Light Tint for High Page Visibility */
            backdrop-filter: blur(3px);          /* Subtle Blur */
            -webkit-backdrop-filter: blur(3px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s ease;
        }

        #splash-overlay.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Glassmorphism Card Wrapper */
        .glass-card {
            background: rgba(15, 23, 42, 0.82);
            border: 1px solid rgba(56, 189, 248, 0.35);
            padding: 32px 28px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 25px rgba(56, 189, 248, 0.2);
            text-align: center;
            max-width: 550px;
            width: 90%;
            position: relative;
            overflow: hidden;
        }

        /* Scanning Neon Border Glow for Card */
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #38bdf8, #818cf8, transparent);
            animation: card-scan 2.5s linear infinite;
        }

        @keyframes card-scan {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        /* Tech Tags Floating Animations */
        .tech-tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .tech-tags.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .tag-pill {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid #38bdf8;
            color: #e0f2fe;
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 14.5px;
            letter-spacing: 0.5px;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
            animation: float-pulse 3s ease-in-out infinite alternate;
        }

        .tag-pill:nth-child(2) { animation-delay: 0.3s; }
        .tag-pill:nth-child(3) { animation-delay: 0.6s; }
        .tag-pill:nth-child(4) { animation-delay: 0.9s; }

        @keyframes float-pulse {
            0% { transform: translateY(0); box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }
            100% { transform: translateY(-5px); box-shadow: 0 6px 18px rgba(56, 189, 248, 0.5); }
        }

        /* BUBBLE ANIMATION STYLES */
        .bubble-wrapper {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .bubble-wrapper.show {
            opacity: 1;
        }

        .bubble {
            width: 12px;
            height: 12px;
            background: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 10px #38bdf8;
            animation: bounce 0.6s infinite alternate;
        }

        .bubble:nth-child(2) { animation-delay: 0.2s; }
        .bubble:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-12px); }
        }

        /* PROGRESS MESSAGE STYLES & BAR */
        .progress-box {
            margin-top: 18px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .progress-box.show {
            opacity: 1;
        }

        .progress-text {
            font-size: 14.5px;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #22c55e);
            border-radius: 10px;
            transition: width 1.5s ease-in-out;
            box-shadow: 0 0 12px #38bdf8;
        }
    </style>
</head>

<body>

    <!-- MAIN PAGE CONTENT (High Visibility in Background) -->
    <app-header></app-header>
    <main class="wide">
        <h1>Free programming tutorials</h1>
        <p>Pick a language to see all of its topics in the left menu.</p>
        <div class="grid">
            <a href="/design-pattern/">Design Pattern</a>
            <a href="/java/">Java</a>
            <a href="/">Microservices</a>
            <a href="/">Kafka</a>
            <a href="/springboot/">Spring Boot</a>
            <a href="/">Interview Question</a>
        </div>
    </main>
    <app-footer></app-footer>

    <!-- OVERLAY ANIMATION -->
    <div id="splash-overlay">
        <div class="glass-card">
            
            <!-- Tech Stack Animation Tags -->
            <div class="tech-tags" id="tech-tags">
                <span class="tag-pill">☕ Java</span>
                <span class="tag-pill">☁️ AWS</span>
                <span class="tag-pill">⚙️ Microservices</span>
                <span class="tag-pill">🚀 Interview Prep</span>
            </div>

            <!-- Bouncing Loading Bubbles -->
            <div class="bubble-wrapper" id="bubble-wrapper">
                <div class="bubble"></div>
                <div class="bubble"></div>
                <div class="bubble"></div>
            </div>

            <!-- Progress Message & Animated Loading Bar -->
            <div class="progress-box" id="progress-box">
                <div class="progress-text">⚙️ Development in progress... Content updating soon!</div>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="progress-bar"></div>
                </div>
            </div>

        </div>
    </div>

    <!-- TIMELINE SCRIPT -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const overlay = document.getElementById("splash-overlay");
            const techTags = document.getElementById("tech-tags");
            const bubbleWrapper = document.getElementById("bubble-wrapper");
            const progressBox = document.getElementById("progress-box");
            const progressBar = document.getElementById("progress-bar");

            // Step 1: Page Load hone par immediately Tech Tags appear (0.1s)
            setTimeout(() => {
                techTags.classList.add("show");
            }, 100);

            // Step 2: 2 second baad - Bubbles & Progress Bar dikhega
            setTimeout(() => {
                bubbleWrapper.classList.add("show");
                progressBox.classList.add("show");
                progressBar.style.width = "100%";
            }, 2000);

            // Step 3: Animation complete hone ke baad (3.8 second baad) Fade Out Smoothly
            setTimeout(() => {
                overlay.classList.add("fade-out");
            }, 3800);
        });
    </script>
</body>

</html>
